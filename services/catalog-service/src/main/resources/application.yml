server:
  port: 8082
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://topchoice:topchoice_local_pw@localhost:27017/topchoice_catalog?authSource=admin}
      auto-index-creation: false     # الفهارس تُدار عبر MongoIndexInitializer صراحةً
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 800ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 8
  cache:
    type: redis
    # التفاصيل (TTL لكل كاش، الـ serializers، معالج الأخطاء) في CacheConfig
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: lz4
        linger.ms: 20

topchoice:
  catalog:
    topic: catalog.product.v1
    default-page-size: 24
    max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false                 # Redis كاش اختياري: سقوطه لا يجعل الـ pod غير جاهز
  metrics:
    tags:
      service: catalog-service

logging:
  level:
    root: INFO
    com.topchoice: ${LOG_LEVEL:INFO}
    org.springframework.data.mongodb.core.MongoTemplate: ${MONGO_LOG_LEVEL:INFO}
