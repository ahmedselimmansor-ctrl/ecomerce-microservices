[pytest]
# asyncio_mode=auto يجعل كل دالة async اختبارًا بلا وسم يدوي على كل واحدة —
# الوسم المنسي يجعل الاختبار «ينجح» دون أن يُنفَّذ أصلًا.
asyncio_mode = auto
# نثبّت النطاق صراحةً: الافتراضي سيتغيّر في إصدار قادم، وتركه يعني أن
# ترقية pytest-asyncio تغيّر سلوك التركيبات بلا أن نطلب ذلك.
asyncio_default_fixture_loop_scope = function
testpaths = tests
