server:
  port: 8081
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: identity-service
  lifecycle:
    timeout-per-shutdown-phase: 25s
  threads:
    virtual:
      enabled: true          # Java 21 virtual threads — عدد اتصالات متزامنة أعلى بكثير
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_IDENTITY:topchoice_identity}
    username: ${POSTGRES_USER:topchoice}
    password: ${POSTGRES_PASSWORD:topchoice_local_pw}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: 2
      connection-timeout: 3000
      leak-detection-threshold: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true

topchoice:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-9f2b7c1d4e6a8b0c2d4e6f8a0b2c4d6e}
    issuer: topchoice-identity
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      service: identity-service

logging:
  level:
    root: INFO
    com.topchoice: ${LOG_LEVEL:INFO}
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n'
