server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_INVENTORY:noon_inventory}
    username: ${POSTGRES_USER:noon}
    password: ${POSTGRES_PASSWORD:noon_local_pw}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        # لا نضيف ترويسات نوع Java — المستهلكون بلغات أخرى (Node/Python)
        spring.json.add.type.headers: false
    consumer:
      group-id: inventory-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
    listener:
      # manual مطلوب: بدونه لا تُحقن Acknowledgment في المستمع
      # ويفشل الاستدعاء بـ invokeHandler Failed
      ack-mode: manual
      concurrency: 3

noon:
  topics:
    order-events: order.events.v1
    inventory-events: inventory.events.v1
  reservation:
    ttl-minutes: 15               # الحجز يُحرَّر تلقائيًا إن لم يكتمل الدفع
    sweep-cron: "0 */2 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: inventory-service

logging:
  level:
    root: INFO
    com.noon: ${LOG_LEVEL:INFO}
