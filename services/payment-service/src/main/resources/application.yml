server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_PAYMENT:noon_payment}
    username: ${POSTGRES_USER:noon}
    password: ${POSTGRES_PASSWORD:noon_local_pw}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # manual مطلوب: بدونه لا تُحقن Acknowledgment في المستمع
      # ويفشل الاستدعاء بـ invokeHandler Failed
      ack-mode: manual
      concurrency: 2

noon:
  topics:
    order-events: order.events.v1
    payment-events: payment.events.v1
  gateway:
    # محليًا: بوابة وهمية. في الإنتاج: stripe | checkout | tabby عبر Secrets Manager
    provider: ${PAYMENT_PROVIDER:mock}
    # نسبة فشل مُصطنعة لاختبار مسار التعويض في الـ Saga
    mock-failure-rate: ${PAYMENT_MOCK_FAILURE_RATE:0.1}
    mock-latency-ms: ${PAYMENT_MOCK_LATENCY_MS:250}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: payment-service

logging:
  level:
    root: INFO
    com.noon: ${LOG_LEVEL:INFO}
