# ============================================================================
#  TopChoice Clone — full local stack
#  make up
#
#  كل حاوية هنا لها مقابل مُدار على Google Cloud (انظر docs/02-gcp-services.md):
#    postgres  → Cloud SQL for PostgreSQL      mongo      → MongoDB Atlas on GCP
#    redis     → Memorystore for Redis Cluster kafka      → Managed Service for Apache Kafka
#    opensearch→ OpenSearch مُدار ذاتيًا على GKE  mailpit    → SendGrid
#    pubsub-emulator   → Pub/Sub               fake-gcs   → Cloud Storage
#    firestore-emulator→ Firestore (Native)
#
#  لا يوجد محاكي لـ Secret Manager ولا لـ Retail API: الأول نغنيه بـ .env
#  محليًا، والثاني تسقط الخدمة تلقائيًا إلى محرّكها الاحتياطي حين لا يُضبط.
# ============================================================================

name: topchoice

x-common: &common
  restart: unless-stopped
  networks: [topchoice]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-java-env: &java-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-topchoice}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topchoice_local_pw}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SPRING_PROFILES_ACTIVE: docker

services:

  # ------------------------------------------------------------ data stores

  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topchoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topchoice_local_pw}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres-init.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topchoice}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    <<: *common
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-topchoice}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-topchoice_local_pw}
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    <<: *common
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    <<: *common
    image: apache/kafka:3.8.1
    environment:
      # وضع KRaft — بلا ZooKeeper، وهو ما تعتمده أيضًا
      # Managed Service for Apache Kafka في السحابة
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      CLUSTER_ID: topchoice-local-cluster-0001
    ports: ["29092:29092"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s

  opensearch:
    <<: *common
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["9200:9200"]
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # -------------------------------------------------------- GCP emulation

  # محاكيا Pub/Sub و Firestore رسميان ويأتيان داخل صورة gcloud نفسها، فنعيد
  # استخدام الصورة ذاتها مرتين ولا نسحب إلا طبقاتها مرة واحدة.
  pubsub-emulator:
    <<: *common
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:580.0.0-emulators
    command: >
      gcloud beta emulators pubsub start
      --project=${GOOGLE_CLOUD_PROJECT:-topchoice-local}
      --host-port=0.0.0.0:8681
    ports: ["8681:8681"]
    healthcheck:
      # المحاكي لا يعرض مسار صحة؛ فتح المنفذ هو الإشارة الوحيدة الموثوقة،
      # ونستدعي bash صراحةً لأن /dev/tcp غير موجود في sh الافتراضي.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8681' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  firestore-emulator:
    <<: *common
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:580.0.0-emulators
    # المنفذ الافتراضي للمحاكي هو 8080 وهو منفذ الـ api-gateway هنا، فننقله
    # إلى 8091 بدل تحريك بوابة تعرفها كل السكربتات والاختبارات.
    command: >
      gcloud beta emulators firestore start
      --project=${GOOGLE_CLOUD_PROJECT:-topchoice-local}
      --host-port=0.0.0.0:8091
      --database-mode=firestore-native
    ports: ["8091:8091"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8091' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  fake-gcs:
    <<: *common
    image: fsouza/fake-gcs-server:1.55.1
    # http بدل https: شهادة موقّعة ذاتيًا تعني تعطيل التحقق في كل عميل،
    # وهي عادة سيئة تتسرّب إلى الإنتاج. public-host يجعل روابط التنزيل
    # التي يولّدها المحاكي صالحة من المتصفح لا من داخل الشبكة فقط.
    command: >
      -scheme http
      -host 0.0.0.0
      -port 4443
      -public-host localhost:4443
      -backend memory
    ports: ["4443:4443"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4443/storage/v1/b >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # حاوية تُنشئ الموارد ثم تخرج. صورة curl وحدها تكفي: واجهات المحاكيات
  # كلها REST، وسحب صورة gcloud كاملة (~3 GB) لأجل بضعة نداءات إسراف.
  gcp-init:
    image: curlimages/curl:8.21.0
    networks: [topchoice]
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      pubsub-emulator: { condition: service_started }
      firestore-emulator: { condition: service_started }
      fake-gcs: { condition: service_started }
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-topchoice-local}
      GCS_MEDIA_BUCKET: ${GCS_MEDIA_BUCKET:-topchoice-media-local}
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8681
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8091
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
    volumes:
      - ./init/gcp-emulators-init.sh:/init/gcp-emulators-init.sh:ro
    entrypoint: ["/bin/sh", "/init/gcp-emulators-init.sh"]

  mailpit:
    <<: *common
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # الواجهة
    environment:
      MP_MAX_MESSAGES: "500"

  # ----------------------------------------------------------- dev tooling

  kafka-ui:
    <<: *common
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: topchoice-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports: ["8090:8080"]

  opensearch-dashboards:
    <<: *common
    image: opensearchproject/opensearch-dashboards:2.18.0
    depends_on:
      opensearch: { condition: service_healthy }
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["5601:5601"]

  # ------------------------------------------------------------- services

  identity-service:
    <<: *common
    build: ../services/identity-service
    image: topchoice/identity-service:dev
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *java-env
      POSTGRES_DB_IDENTITY: ${POSTGRES_DB_IDENTITY:-topchoice_identity}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
    ports: ["8081:8081"]

  catalog-service:
    <<: *common
    build: ../services/catalog-service
    image: topchoice/catalog-service:dev
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-topchoice}:${MONGO_INITDB_ROOT_PASSWORD:-topchoice_local_pw}@mongo:27017/topchoice_catalog?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["8082:8082"]

  inventory-service:
    <<: *common
    build: ../services/inventory-service
    image: topchoice/inventory-service:dev
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *java-env
      POSTGRES_DB_INVENTORY: ${POSTGRES_DB_INVENTORY:-topchoice_inventory}
    ports: ["8085:8085"]

  order-service:
    <<: *common
    build: ../services/order-service
    image: topchoice/order-service:dev
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      catalog-service: { condition: service_started }
    environment:
      <<: *java-env
      POSTGRES_DB_ORDER: ${POSTGRES_DB_ORDER:-topchoice_order}
      SERVICE_URL_CATALOG: http://catalog-service:8082
    ports: ["8083:8083"]

  payment-service:
    <<: *common
    build: ../services/payment-service
    image: topchoice/payment-service:dev
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      <<: *java-env
      POSTGRES_DB_PAYMENT: ${POSTGRES_DB_PAYMENT:-topchoice_payment}
      PAYMENT_PROVIDER: mock
      # 10% فشل مُصطنع — لاختبار مسار التعويض في الـ Saga فعليًا
      PAYMENT_MOCK_FAILURE_RATE: ${PAYMENT_MOCK_FAILURE_RATE:-0.1}
    ports: ["8084:8084"]

  cart-service:
    <<: *common
    build: ../services/cart-service
    image: topchoice/cart-service:dev
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "8086"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["8086:8086"]

  search-service:
    <<: *common
    build: ../services/search-service
    image: topchoice/search-service:dev
    depends_on:
      opensearch: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-products-v1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["8087:8087"]

  recommendation-service:
    <<: *common
    build: ../services/recommendation-service
    image: topchoice/recommendation-service:dev
    depends_on:
      redis: { condition: service_healthy }
    environment:
      REDIS_URL: redis://redis:6379
      CATALOG_URL: http://catalog-service:8082
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-topchoice-local}
      GCP_REGION: ${GCP_REGION:-me-central1}
      RETAIL_CATALOG: ${RETAIL_CATALOG:-default_catalog}
      # لا محاكي لـ Retail API؛ فراغ ⇒ يعمل المحرك الاحتياطي المحلي
      RETAIL_SERVING_CONFIG_USER: ${RETAIL_SERVING_CONFIG_USER:-}
      RETAIL_SERVING_CONFIG_RELATED: ${RETAIL_SERVING_CONFIG_RELATED:-}
      RETAIL_SERVING_CONFIG_RANKING: ${RETAIL_SERVING_CONFIG_RANKING:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["8088:8088"]

  notification-service:
    <<: *common
    build: ../services/notification-service
    image: topchoice/notification-service:dev
    depends_on:
      kafka: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # أوامر الإشعار الصريحة فقط — إضافة order.events.v1 تُنتج إيميلًا مزدوجًا
      KAFKA_TOPICS: notification.commands.v1
      SERVICE_URL_IDENTITY: http://identity-service:8081
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: noreply@topchoice.local
      PORT: "8089"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["8089:8089"]

  api-gateway:
    <<: *common
    build: ../services/api-gateway
    image: topchoice/api-gateway:dev
    depends_on:
      redis: { condition: service_healthy }
      identity-service: { condition: service_started }
      catalog-service: { condition: service_started }
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      SERVICE_URL_IDENTITY: http://identity-service:8081
      SERVICE_URL_CATALOG: http://catalog-service:8082
      SERVICE_URL_ORDER: http://order-service:8083
      SERVICE_URL_PAYMENT: http://payment-service:8084
      SERVICE_URL_INVENTORY: http://inventory-service:8085
      SERVICE_URL_CART: http://cart-service:8086
      SERVICE_URL_SEARCH: http://search-service:8087
      SERVICE_URL_RECOMMENDATION: http://recommendation-service:8088
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["8080:8080"]

  # ------------------------------------------------------------- frontend

  web:
    <<: *common
    build:
      context: ../frontend/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    image: topchoice/web:dev
    depends_on:
      api-gateway: { condition: service_started }
    environment:
      NODE_ENV: production
      # المتصفح ينادي localhost؛ الـ SSR ينادي داخل الشبكة
      NEXT_PUBLIC_API_URL: http://localhost:8080
      INTERNAL_API_URL: http://api-gateway:8080
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-ar}
      NEXT_PUBLIC_DEFAULT_CURRENCY: ${NEXT_PUBLIC_DEFAULT_CURRENCY:-AED}
    ports: ["3000:3000"]

networks:
  topchoice:
    driver: bridge

volumes:
  pgdata:
  mongodata:
  redisdata:
  kafkadata:
  osdata:
