apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: topchoice

resources:
  - ../../base

# التوسّع بعمق طابور Kafka — يتطلب تثبيت مشغّل KEDA في العنقود
components:
  - ../../components/keda

# الصور من Artifact Registry بوسم إصدار ثابت لا "latest".
# النشر يبدّل الوسم عبر `kustomize edit set image` في خط الـ CI.
#
# المستودع إقليمي في me-central1 — نفس إقليم العنقود عمدًا: سحب صورة
# من إقليم آخر يضيف زمنًا ورسوم نقل على كل توسّع تلقائي، وهو ما يحدث
# بالضبط في اللحظة التي لا تحتمل تأخيرًا.
images:
  - name: topchoice/api-gateway
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/api-gateway
    newTag: v1.0.0
  - name: topchoice/identity-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/identity-service
    newTag: v1.0.0
  - name: topchoice/catalog-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/catalog-service
    newTag: v1.0.0
  - name: topchoice/order-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/order-service
    newTag: v1.0.0
  - name: topchoice/payment-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/payment-service
    newTag: v1.0.0
  - name: topchoice/inventory-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/inventory-service
    newTag: v1.0.0
  - name: topchoice/cart-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/cart-service
    newTag: v1.0.0
  - name: topchoice/search-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/search-service
    newTag: v1.0.0
  - name: topchoice/recommendation-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/recommendation-service
    newTag: v1.0.0
  - name: topchoice/notification-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/notification-service
    newTag: v1.0.0
  - name: topchoice/web
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/web
    newTag: v1.0.0

patches:
  # الخدمات الحرجة تبدأ بعدد أعلى من النسخ
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 6

  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 6

  - target:
      kind: Deployment
      name: catalog-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 6

  # حد أدنى أعلى للتوسّع التلقائي على مسار الشراء
  - target:
      kind: HorizontalPodAutoscaler
      name: order-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 4
      - op: replace
        path: /spec/maxReplicas
        value: 60

  - target:
      kind: ConfigMap
      name: topchoice-config
    patch: |-
      - op: replace
        path: /data/DB_POOL_MAX
        value: "20"

  # الموارد السحابية المسمّاة تحمل لاحقة البيئة، والأساس مضبوط على dev.
  # لا مفر من الترقيع هنا: العنوان الثابت وسياسة Cloud Armor موردان
  # في GCP لا في العنقود، ويشير إليهما الـ Ingress بالاسم فقط.
  - target:
      kind: Ingress
      name: topchoice
    patch: |-
      - op: replace
        path: /metadata/annotations/kubernetes.io~1ingress.global-static-ip-name
        value: topchoice-prod-ingress-ip

  - target:
      kind: BackendConfig
    patch: |-
      - op: replace
        path: /spec/securityPolicy/name
        value: topchoice-prod-armor
