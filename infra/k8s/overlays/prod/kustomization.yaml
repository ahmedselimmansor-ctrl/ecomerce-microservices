apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: topchoice

resources:
  - ../../base

# التوسّع بعمق طابور Kafka — يتطلب تثبيت مشغّل KEDA في العنقود
components:
  - ../../components/keda

# الصور من ECR بوسم إصدار ثابت لا "latest".
# النشر يبدّل الوسم عبر `kustomize edit set image` في خط الـ CI.
images:
  - name: topchoice/api-gateway
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/api-gateway
    newTag: v1.0.0
  - name: topchoice/identity-service
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/identity-service
    newTag: v1.0.0
  - name: topchoice/catalog-service
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/catalog-service
    newTag: v1.0.0
  - name: topchoice/order-service
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/order-service
    newTag: v1.0.0
  - name: topchoice/payment-service
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/payment-service
    newTag: v1.0.0
  - name: topchoice/inventory-service
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/inventory-service
    newTag: v1.0.0
  - name: topchoice/cart-service
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/cart-service
    newTag: v1.0.0
  - name: topchoice/search-service
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/search-service
    newTag: v1.0.0
  - name: topchoice/recommendation-service
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/recommendation-service
    newTag: v1.0.0
  - name: topchoice/notification-service
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/notification-service
    newTag: v1.0.0
  - name: topchoice/web
    newName: ACCOUNT.dkr.ecr.me-south-1.amazonaws.com/topchoice/web
    newTag: v1.0.0

patches:
  # الخدمات الحرجة تبدأ بعدد أعلى من النسخ
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 6

  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 6

  - target:
      kind: Deployment
      name: catalog-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 6

  # حد أدنى أعلى للتوسّع التلقائي على مسار الشراء
  - target:
      kind: HorizontalPodAutoscaler
      name: order-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 4
      - op: replace
        path: /spec/maxReplicas
        value: 60

  - target:
      kind: ConfigMap
      name: topchoice-config
    patch: |-
      - op: replace
        path: /data/DB_POOL_MAX
        value: "20"
