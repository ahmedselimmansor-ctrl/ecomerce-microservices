apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: topchoice

resources:
  - ../../base

# نسخة واحدة لكل خدمة في dev — الغرض التحقق لا التوفر
replicas:
  - name: api-gateway
    count: 1
  - name: identity-service
    count: 1
  - name: catalog-service
    count: 1
  - name: order-service
    count: 1
  - name: payment-service
    count: 1
  - name: inventory-service
    count: 1
  - name: cart-service
    count: 1
  - name: search-service
    count: 1
  - name: recommendation-service
    count: 1
  - name: notification-service
    count: 1
  - name: web
    count: 1
  # OpenSearch بعقدة واحدة: نصاب من واحد صالح تمامًا للتحقق،
  # وثلاث عُقد بقرص SSD لكل منها فاتورة بلا مقابل في dev
  - name: opensearch
    count: 1

# نفس مستودع Artifact Registry الذي يستخدمه الإنتاج، بوسم dev.
# مفتاح المطابقة يبقى `topchoice/<خدمة>` كما في الأساس ليعمل
# `kustomize edit set image` في خط الـ CI دون تعديل.
images:
  - name: topchoice/api-gateway
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/api-gateway
    newTag: dev
  - name: topchoice/identity-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/identity-service
    newTag: dev
  - name: topchoice/catalog-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/catalog-service
    newTag: dev
  - name: topchoice/order-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/order-service
    newTag: dev
  - name: topchoice/payment-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/payment-service
    newTag: dev
  - name: topchoice/inventory-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/inventory-service
    newTag: dev
  - name: topchoice/cart-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/cart-service
    newTag: dev
  - name: topchoice/search-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/search-service
    newTag: dev
  - name: topchoice/recommendation-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/recommendation-service
    newTag: dev
  - name: topchoice/notification-service
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/notification-service
    newTag: dev
  - name: topchoice/web
    newName: me-central1-docker.pkg.dev/PROJECT_ID/topchoice/web
    newTag: dev

patches:
  # موارد أقل بكثير: عقدة واحدة تكفي لكل شيء
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 192Mi

  # HPA و PDB بلا معنى مع نسخة واحدة
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # Spot لكل شيء في dev — التوفير أهم من الاستمرارية هنا.
  # نستهدف الخدمات الحرجة فقط لأنها وحدها تحمل nodeSelector في الأساس،
  # و`op: remove` يفشل على مسار غير موجود.
  - target:
      kind: Deployment
      name: (api-gateway|identity-service|order-service|payment-service|inventory-service|web)
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector

  # OpenSearch بأصغر كومة تُقلع فعلًا. لا نلمس `node.store.allow_mmap`
  # ولا قائمة تشكيل العنقود: الأساس مضبوط ليعمل بعقدة واحدة أصلًا.
  - target:
      kind: StatefulSet
      name: opensearch
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: opensearch
      spec:
        template:
          spec:
            containers:
              - name: opensearch
                env:
                  - name: OPENSEARCH_JAVA_OPTS
                    value: "-Xms512m -Xmx512m"
                resources:
                  requests:
                    cpu: 100m
                    memory: 1Gi
                  limits:
                    cpu: "1"
                    memory: 1536Mi

  # الـ ConfigMap مورد عادي في الأساس لا generator، فنعدّله بترقيع
  # لا بـ configMapGenerator (الذي يدمج المولّدات فقط)
  - target:
      kind: ConfigMap
      name: topchoice-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
      - op: replace
        path: /data/DB_POOL_MAX
        value: "5"
