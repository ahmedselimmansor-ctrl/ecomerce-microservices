# ============================================================================
#  Ingress عبر GKE Ingress (موازن التحميل العالمي من Google).
#
#  الموازن عالمي لا إقليمي، وعنوانه IP واحد في anycast: الطلب يدخل شبكة
#  Google من أقرب نقطة للمستخدم ثم يقطع بقية الطريق داخلها. هذا وحده
#  يعطينا ما كنا نضع طبقة CDN منفصلة أمام الموازن لأجله.
#
#  التوجيه إلى الـ pods مباشرة عبر NEG (container-native load balancing)،
#  بلا قفزة NodePort إضافية فيقلّ زمن الاستجابة. يُفعَّل تلقائيًا لأن
#  الخدمات من نوع ClusterIP في عنقود VPC-native.
#
#  الإعداد مفكّك إلى موارد مستقلة عمدًا: ManagedCertificate للشهادة،
#  FrontendConfig للواجهة الأمامية، BackendConfig لكل خدمة خلفية على حدة.
#  الفائدة أن BackendConfig يُربط بالـ Service لا بالـ Ingress، فتختلف
#  سياسة الـ gateway عن سياسة الواجهة — أحدهما بلا CDN والآخر به —
#  دون تكرار الـ Ingress نفسه.
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: topchoice
  namespace: topchoice
  annotations:
    kubernetes.io/ingress.class: "gce"

    # عنوان IP عالمي ثابت يُنشأ في Terraform قبل الـ Ingress.
    # بدونه يمنح الموازن عنوانًا مؤقتًا يتغيّر مع كل إعادة إنشاء،
    # فينهار سجل Cloud DNS بصمت.
    kubernetes.io/ingress.global-static-ip-name: "topchoice-dev-ingress-ip"

    # الشهادة يديرها Google: يصدرها ويجدّدها ما دام سجل DNS يشير للعنوان
    networking.gke.io/managed-certificates: "topchoice-cert"

    # إعادة التوجيه إلى HTTPS وسياسة TLS
    networking.gke.io/v1beta1.FrontendConfig: "topchoice-frontend"

spec:
  rules:
    - http:
        paths:
          # ترتيب المسارات مهم: الأكثر تحديدًا أولًا
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          # كل ما تبقّى يذهب لواجهة Next.js
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
---
# الشهادة المُدارة. الإصدار يفشل ما لم يكن سجل DNS يشير مسبقًا إلى
# العنوان الثابت أعلاه — وهذا ترتيب لا يمكن عكسه.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: topchoice-cert
  namespace: topchoice
spec:
  domains:
    - REPLACE_WITH_DOMAIN
    - www.REPLACE_WITH_DOMAIN
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: topchoice-frontend
  namespace: topchoice
spec:
  redirectToHttps:
    enabled: true
    # 301 لا 302: نريد المتصفحات وحقول SEO أن تحفظ التحويل نهائيًا
    responseCodeName: MOVED_PERMANENTLY
  # سياسة TLS تُنشأ في Terraform. الافتراضي في GCP يقبل TLS 1.0،
  # وهو ما يسقط في تدقيق PCI لبوابة دفع.
  sslPolicy: topchoice-tls-policy
---
# ============================================================================
#  BackendConfig للـ gateway: بلا CDN إطلاقًا.
#  تخزين استجابة API مؤقتًا يعني تسريب سلة مستخدم إلى آخر — الخطر أكبر
#  بكثير من المكسب.
# ============================================================================
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: api-gateway
  namespace: topchoice
spec:
  # Cloud Armor يقابل WAF: نفس القواعد المُدارة ونفس تحديد المعدل
  securityPolicy:
    name: topchoice-dev-armor

  healthCheck:
    type: HTTP
    requestPath: /health/live
    port: 8080
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3

  # 60 ثانية: أطول من أبطأ نداء نتوقعه عبر البوابة، وأقصر من أن يحتجز
  # الموازن اتصالًا مات خلفه
  timeoutSec: 60

  # الإلغاء التدريجي: الموازن يتوقف عن إرسال طلبات جديدة وينتظر الجارية.
  # 30 ثانية أقصر من terminationGracePeriodSeconds في الـ Deployment عمدًا.
  connectionDraining:
    drainingTimeoutSec: 30

  # سجلّات الوصول تذهب إلى Cloud Logging لا إلى دلو تخزين:
  # الاستعلام فوري بلا خطوة تحميل وتحليل، وهذا ما كان ينقص access_logs.s3
  logging:
    enable: true
    sampleRate: 1.0
---
# ============================================================================
#  BackendConfig للواجهة: هنا الـ CDN مفيد فعلًا.
#  أصول Next.js الثابتة تُخدَّم من حافة Google، فلا تصل إلى الـ pods أصلًا.
# ============================================================================
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: web
  namespace: topchoice
spec:
  securityPolicy:
    name: topchoice-dev-armor

  cdn:
    enabled: true
    # CACHE_ALL_STATIC لا FORCE_CACHE_ALL: صفحات Next.js المُخصّصة
    # للمستخدم يجب ألّا تُخزَّن، والوضع الأول يحترم رؤوس Cache-Control
    cachePolicy:
      includeHost: true
      includeProtocol: true
      includeQueryString: true
    cacheMode: CACHE_ALL_STATIC
    clientTtl: 3600
    defaultTtl: 3600
    maxTtl: 86400
    # يمنع انهيار الأصل عند انتهاء صلاحية عنصر مطلوب بكثافة:
    # طلب واحد فقط يمر، والباقي ينتظر النتيجة
    requestCoalescing: true
    negativeCaching: true
    serveWhileStale: 86400

  healthCheck:
    type: HTTP
    requestPath: /health/live
    port: 3000
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3

  timeoutSec: 60
  connectionDraining:
    drainingTimeoutSec: 30

  # لا التصاق بالجلسة: الحالة كلها في Memorystore، فأي نسخة تخدم أي مستخدم.
  # تفعيله هنا كان سيقيّد التوزيع بلا مقابل — نُصرّح به لأن الافتراضي
  # يختلف بين موازنات GCP ولا نريد الاعتماد على الافتراضي.
  sessionAffinity:
    affinityType: "NONE"

  logging:
    enable: true
    sampleRate: 1.0
