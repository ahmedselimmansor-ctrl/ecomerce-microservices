apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noon

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: noon
      app.kubernetes.io/managed-by: kustomize

resources:
  - 00-namespace.yaml
  - 01-config.yaml
  - 02-secrets.yaml
  - 03-serviceaccounts.yaml
  - 10-api-gateway.yaml
  - 11-identity-service.yaml
  - 12-catalog-service.yaml
  - 13-order-service.yaml
  - 14-payment-service.yaml
  - 15-inventory-service.yaml
  - 16-cart-service.yaml
  - 17-search-service.yaml
  - 18-recommendation-service.yaml
  - 19-notification-service.yaml
  - 20-web.yaml
  - 50-ingress.yaml
  - 60-networkpolicy.yaml

images:
  - name: noon/api-gateway
    newTag: dev
  - name: noon/identity-service
    newTag: dev
  - name: noon/catalog-service
    newTag: dev
  - name: noon/order-service
    newTag: dev
  - name: noon/payment-service
    newTag: dev
  - name: noon/inventory-service
    newTag: dev
  - name: noon/cart-service
    newTag: dev
  - name: noon/search-service
    newTag: dev
  - name: noon/recommendation-service
    newTag: dev
  - name: noon/notification-service
    newTag: dev
  - name: noon/web
    newTag: dev
