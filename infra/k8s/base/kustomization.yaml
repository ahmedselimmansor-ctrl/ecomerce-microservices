apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: topchoice

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: topchoice
      app.kubernetes.io/managed-by: kustomize

resources:
  - 00-namespace.yaml
  - 01-config.yaml
  - 02-secrets.yaml
  - 03-serviceaccounts.yaml
  - 10-api-gateway.yaml
  - 11-identity-service.yaml
  - 12-catalog-service.yaml
  - 13-order-service.yaml
  - 14-payment-service.yaml
  - 15-inventory-service.yaml
  - 16-cart-service.yaml
  - 17-search-service.yaml
  - 18-recommendation-service.yaml
  - 19-notification-service.yaml
  - 20-web.yaml
  - 50-ingress.yaml
  - 60-networkpolicy.yaml

images:
  - name: topchoice/api-gateway
    newTag: dev
  - name: topchoice/identity-service
    newTag: dev
  - name: topchoice/catalog-service
    newTag: dev
  - name: topchoice/order-service
    newTag: dev
  - name: topchoice/payment-service
    newTag: dev
  - name: topchoice/inventory-service
    newTag: dev
  - name: topchoice/cart-service
    newTag: dev
  - name: topchoice/search-service
    newTag: dev
  - name: topchoice/recommendation-service
    newTag: dev
  - name: topchoice/notification-service
    newTag: dev
  - name: topchoice/web
    newTag: dev
