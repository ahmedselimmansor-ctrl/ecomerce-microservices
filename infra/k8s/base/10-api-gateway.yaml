# بوابة الحافة: أعلى عدد نسخ لأن كل طلب يمر بها
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: noon
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: noon
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # لا نقلّل الطاقة أثناء النشر: pod جديد يصعد قبل أن ينزل القديم
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: noon
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: noon-default
      # مهلة الإنهاء تسمح بإنهاء الطلبات الجارية قبل إغلاق العملية
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # الخدمات الحرجة على On-Demand فقط: سحب Spot أثناء معالجة طلب
      # يعني معاملة معلّقة، وهو ثمن لا يستحق التوفير
      nodeSelector:
        karpenter.sh/capacity-type: on-demand
      # توزيع النسخ على نطاقات التوفر: سقوط نطاق لا يُسقط الخدمة
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      containers:
        - name: api-gateway
          image: noon/api-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: noon-config, key: LOG_LEVEL } }
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: noon-config, key: AWS_REGION } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: noon-database, key: REDIS_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: noon-app, key: JWT_SECRET } }
            - name: SERVICE_URL_IDENTITY
              valueFrom: { configMapKeyRef: { name: noon-config, key: SERVICE_URL_IDENTITY } }
            - name: SERVICE_URL_CATALOG
              valueFrom: { configMapKeyRef: { name: noon-config, key: SERVICE_URL_CATALOG } }
            - name: SERVICE_URL_ORDER
              valueFrom: { configMapKeyRef: { name: noon-config, key: SERVICE_URL_ORDER } }
            - name: SERVICE_URL_PAYMENT
              valueFrom: { configMapKeyRef: { name: noon-config, key: SERVICE_URL_PAYMENT } }
            - name: SERVICE_URL_INVENTORY
              valueFrom: { configMapKeyRef: { name: noon-config, key: SERVICE_URL_INVENTORY } }
            - name: SERVICE_URL_CART
              valueFrom: { configMapKeyRef: { name: noon-config, key: SERVICE_URL_CART } }
            - name: SERVICE_URL_SEARCH
              valueFrom: { configMapKeyRef: { name: noon-config, key: SERVICE_URL_SEARCH } }
            - name: SERVICE_URL_RECOMMENDATION
              valueFrom: { configMapKeyRef: { name: noon-config, key: SERVICE_URL_RECOMMENDATION } }
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # لا حد للـ CPU عمدًا في الخدمات الحساسة للزمن: الـ throttling
              # يضاعف زمن الاستجابة أسوأ من الازدحام نفسه
              cpu: 1000m
              memory: 512Mi
          # startupProbe يمنح الإقلاع البطيء (JVM) وقتًا كافيًا
          # دون إرخاء liveness بعد الإقلاع
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # مهلة قصيرة قبل الإغلاق: تسمح لـ kube-proxy بإزالة الـ pod
                # من جدول التوجيه قبل أن يتوقف عن القبول
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: noon
  labels:
    app.kubernetes.io/name: api-gateway
  annotations:
    # يوجّه الحركة لأقرب نسخة داخل نفس نطاق التوفر:
    # يقلّل زمن الاستجابة وتكلفة نقل البيانات بين النطاقات
    service.kubernetes.io/topology-mode: Auto
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: noon
spec:
  # يضمن بقاء أغلبية النسخ أثناء صيانة العُقد أو سحب Spot
  minAvailable: 60%
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: noon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # الصعود فوري: تأخير التوسّع أثناء ذروة مفاجئة يعني طلبات مفقودة
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # الهبوط بطيء: يتجنّب التذبذب (thrashing) بعد موجة قصيرة
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
