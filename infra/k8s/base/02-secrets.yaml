# ============================================================================
#  الأسرار عبر External Secrets Operator.
#
#  لا يوجد سرّ واحد مكتوب في Git. المصدر هو AWS Secrets Manager، والوصول
#  إليه عبر IRSA — أي دور IAM مرتبط بـ ServiceAccount، بلا مفاتيح ثابتة.
#  المشغّل يزامن القيم إلى Kubernetes Secrets ويجدّدها كل ساعة.
# ============================================================================

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: topchoice
spec:
  provider:
    aws:
      service: SecretsManager
      region: me-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: topchoice
  annotations:
    # يُستبدل بـ ARN الحقيقي من مخرجات Terraform (external_secrets_role_arn)
    eks.amazonaws.com/role-arn: "REPLACE_WITH_EXTERNAL_SECRETS_ROLE_ARN"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: topchoice-database
  namespace: topchoice
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: topchoice-database
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: topchoice-prod/aurora/master
        property: host
    - secretKey: POSTGRES_USER
      remoteRef:
        key: topchoice-prod/aurora/master
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: topchoice-prod/aurora/master
        property: password
    - secretKey: MONGO_URI
      remoteRef:
        key: topchoice-prod/documentdb/master
        property: uri
    - secretKey: REDIS_URL
      remoteRef:
        key: topchoice-prod/redis/auth
        property: url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: topchoice-app
  namespace: topchoice
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: topchoice-app
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: topchoice-prod/app/jwt
        property: secret
    - secretKey: PAYMENT_PROVIDER_KEY
      remoteRef:
        key: topchoice-prod/app/payment
        property: apiKey
    - secretKey: PERSONALIZE_CAMPAIGN_USER
      remoteRef:
        key: topchoice-prod/app/personalize
        property: campaignUserArn
    - secretKey: PERSONALIZE_TRACKING_ID
      remoteRef:
        key: topchoice-prod/app/personalize
        property: trackingId
