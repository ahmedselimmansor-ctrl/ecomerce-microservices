# ============================================================================
#  الأسرار عبر External Secrets Operator.
#
#  لا يوجد سرّ واحد مكتوب في Git. المصدر هو GCP Secret Manager، والوصول
#  إليه عبر Workload Identity — أي حساب خدمة GCP مربوط بـ ServiceAccount
#  في العنقود، بلا مفاتيح JSON ثابتة تُسرَّب أو تُنسى.
#  المشغّل يزامن القيم إلى Kubernetes Secrets ويجدّدها كل ساعة.
#
#  قيد يوقع كثيرين: معرّف السرّ في Secret Manager لا يقبل `/`، فالتسلسل
#  الهرمي يُحاكى بالشرطة — `topchoice-prod-cloudsql-master` وما شابهه.
#  السرّ نفسه يحمل عدة حقول JSON نقرأها بـ `property`.
# ============================================================================

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secrets
  namespace: topchoice
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        # لا secretRef هنا عمدًا: المشغّل يستبدل هوية الـ KSA بتوكن
        # حساب خدمة GCP عبر خادم البيانات الوصفية. البديل — مفتاح JSON
        # في Secret — يعيدنا إلى المشكلة التي جئنا لحلّها.
        workloadIdentity:
          clusterLocation: me-central1
          clusterName: REPLACE_WITH_GKE_CLUSTER_NAME
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: topchoice
  annotations:
    # الربط الثاني للعلاقة يتم في Terraform: منح الدور
    # roles/iam.workloadIdentityUser للعضو
    # serviceAccount:PROJECT_ID.svc.id.goog[topchoice/external-secrets-sa]
    iam.gke.io/gcp-service-account: "topchoice-external-secrets@PROJECT_ID.iam.gserviceaccount.com"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: topchoice-database
  namespace: topchoice
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secrets
    kind: SecretStore
  target:
    name: topchoice-database
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: topchoice-prod-cloudsql-master
        property: host
    - secretKey: POSTGRES_USER
      remoteRef:
        key: topchoice-prod-cloudsql-master
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: topchoice-prod-cloudsql-master
        property: password
    - secretKey: MONGO_URI
      remoteRef:
        key: topchoice-prod-mongodb-atlas
        property: uri
    - secretKey: REDIS_URL
      remoteRef:
        key: topchoice-prod-memorystore-auth
        property: url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: topchoice-app
  namespace: topchoice
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secrets
    kind: SecretStore
  target:
    name: topchoice-app
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: topchoice-prod-app-jwt
        property: secret
    - secretKey: PAYMENT_PROVIDER_KEY
      remoteRef:
        key: topchoice-prod-app-payment
        property: apiKey
    - secretKey: RETAIL_SERVING_CONFIG
      remoteRef:
        key: topchoice-prod-app-retail
        property: servingConfig
    - secretKey: RETAIL_EVENT_API_KEY
      remoteRef:
        key: topchoice-prod-app-retail
        property: eventApiKey
    # SendGrid: لا خدمة بريد أصلية في GCP إطلاقًا، فالمزوّد خارجي
    # ومفتاحه سرّ كامل لا مجرد هوية سحابية
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: topchoice-prod-app-sendgrid
        property: apiKey
---
# بيانات اعتماد OAuth التي يستخدمها KEDA لقراءة تأخّر Kafka.
# لماذا سرّ منفصل؟ لأن مقياس KEDA يعمل خارج pods التطبيق، فلا يرث
# هوية أي منها، وسكالر Kafka لا يملك مسار Workload Identity أصلًا.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: topchoice-kafka-oauth
  namespace: topchoice
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secrets
    kind: SecretStore
  target:
    name: topchoice-kafka-oauth
    creationPolicy: Owner
  data:
    - secretKey: clientID
      remoteRef:
        key: topchoice-prod-kafka-oauth
        property: clientID
    - secretKey: clientSecret
      remoteRef:
        key: topchoice-prod-kafka-oauth
        property: clientSecret
