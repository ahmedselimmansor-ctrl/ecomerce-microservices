# ============================================================================
#  سياسات الشبكة — الحاجز الحقيقي أمام الوصول الجانبي.
#
#  المبدأ: منع كل شيء افتراضيًا، ثم السماح بالمسارات المعروفة فقط.
#  هذا ما يجعل نقاط `/internal/` آمنة فعلًا لا مجرد محجوبة عند الـ gateway.
#
#  يتطلب تفعيل GKE Dataplane V2 (Cilium) أو Calico على العنقود.
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: topchoice
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# DNS مسموح للجميع، وإلا لن يعمل أي اكتشاف للخدمات
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: topchoice
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# الـ gateway والواجهة يستقبلان من موازن Google (خارج الـ namespace)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-edge
  namespace: topchoice
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [api-gateway, web]
  policyTypes: [Ingress]
  ingress:
    - from:
        # تفصيلة تُنسى فيسقط الـ Ingress بصمت: الموازن العالمي لا يسكن
        # الشبكة الخاصة، بل يصل إلى الـ pods عبر NEG من نطاقين ثابتين
        # يملكهما Google. الاكتفاء بنطاق الشبكة يعني فحص صحة فاشلًا
        # دائمًا وخلفيات تُعلَن غير سليمة بلا سبب ظاهر.
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
        # نطاق الشبكة نفسه — للنداءات الداخلية ولفحوص الصحة من العُقد
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3000
---
# خدمات المجال تستقبل من الـ gateway فقط.
# هذا ما يمنع الوصول المباشر إلى /internal/ حتى من داخل العنقود.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-services
  namespace: topchoice
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - identity-service
          - catalog-service
          - order-service
          - payment-service
          - inventory-service
          - cart-service
          - search-service
          - recommendation-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
    # نداءات بين الخدمات المسموح بها صراحةً
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: recommendation-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notification-service
    # جمع المقاييس
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
# OpenSearch صار داخل العنقود بعد الهجرة، فلم يعد محميًا بحدود خدمة
# مُدارة كما كان. القاعدة هنا تعوّض ذلك: خدمة البحث وحدها تصل إلى منفذ
# الاستعلام، وعُقد المحرك تصل إلى بعضها على منفذ النقل لتكوين العنقود.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-search-to-opensearch
  namespace: topchoice
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: search-service
      ports:
        - protocol: TCP
          port: 9200
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch
      ports:
        - protocol: TCP
          port: 9300
---
# الخروج إلى قواعد البيانات وخدمات Google Cloud
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-data
  namespace: topchoice
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 5432   # Cloud SQL for PostgreSQL عبر Auth Proxy
        - protocol: TCP
          port: 27017  # MongoDB Atlas عبر Private Service Connect
        - protocol: TCP
          port: 6379   # Memorystore for Redis Cluster
        - protocol: TCP
          port: 9092   # Managed Service for Apache Kafka
        - protocol: TCP
          port: 443    # Private Google Access ونقاط PSC
    # نداءات بين الخدمات داخل الـ namespace — ومنها OpenSearch على 9200
    - to:
        - podSelector: {}
    # ============================================================
    #  خادم البيانات الوصفية على 169.254.169.254 — قاعدة تبدو خاطئة
    #  للوهلة الأولى.
    #
    #  الغريزة تقول: احجب هذا العنوان، فهو مصدر أوراق الاعتماد.
    #  لكن مع Workload Identity هو المسار المُعتمد الوحيد لها: الخادم
    #  يعترض الطلب ويردّ بتوكن حساب الخدمة المرتبط بالـ KSA صاحب الـ pod
    #  تحديدًا، لا بهوية العقدة التي يجلس عليها. حجبه لا يزيد الأمان،
    #  بل يجعل كل نداء إلى Google Cloud API يفشل بلا أوراق اعتماد.
    #  العزل هنا مسؤولية الوسيط نفسه لا قاعدة الشبكة.
    # ============================================================
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    # HTTPS للخارج (بوابات الدفع و SendGrid) — عبر Cloud NAT
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
