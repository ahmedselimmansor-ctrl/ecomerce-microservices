# مصدر الحقيقة للمخزون: On-Demand فقط
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: noon
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: noon
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # لا نقلّل الطاقة أثناء النشر: pod جديد يصعد قبل أن ينزل القديم
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/part-of: noon
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: noon-default
      # مهلة الإنهاء تسمح بإنهاء الطلبات الجارية قبل إغلاق العملية
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # الخدمات الحرجة على On-Demand فقط: سحب Spot أثناء معالجة طلب
      # يعني معاملة معلّقة، وهو ثمن لا يستحق التوفير
      nodeSelector:
        karpenter.sh/capacity-type: on-demand
      # توزيع النسخ على نطاقات التوفر: سقوط نطاق لا يُسقط الخدمة
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-service
      containers:
        - name: inventory-service
          image: noon/inventory-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: noon-config, key: LOG_LEVEL } }
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: noon-config, key: AWS_REGION } }
            - name: POSTGRES_HOST
              valueFrom: { secretKeyRef: { name: noon-database, key: POSTGRES_HOST } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: noon-database, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: noon-database, key: POSTGRES_PASSWORD } }
            - name: DB_POOL_MAX
              valueFrom: { configMapKeyRef: { name: noon-config, key: DB_POOL_MAX } }
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: noon-config, key: KAFKA_BOOTSTRAP_SERVERS } }
            - name: POSTGRES_DB_INVENTORY
              value: "noon_inventory"
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              # لا حد للـ CPU عمدًا في الخدمات الحساسة للزمن: الـ throttling
              # يضاعف زمن الاستجابة أسوأ من الازدحام نفسه
              cpu: 1500m
              memory: 1Gi
          # startupProbe يمنح الإقلاع البطيء (JVM) وقتًا كافيًا
          # دون إرخاء liveness بعد الإقلاع
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # مهلة قصيرة قبل الإغلاق: تسمح لـ kube-proxy بإزالة الـ pod
                # من جدول التوجيه قبل أن يتوقف عن القبول
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: noon
  labels:
    app.kubernetes.io/name: inventory-service
  annotations:
    # يوجّه الحركة لأقرب نسخة داخل نفس نطاق التوفر:
    # يقلّل زمن الاستجابة وتكلفة نقل البيانات بين النطاقات
    service.kubernetes.io/topology-mode: Auto
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-service
  namespace: noon
spec:
  # يضمن بقاء أغلبية النسخ أثناء صيانة العُقد أو سحب Spot
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-service
  namespace: noon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-service
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # الصعود فوري: تأخير التوسّع أثناء ذروة مفاجئة يعني طلبات مفقودة
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # الهبوط بطيء: يتجنّب التذبذب (thrashing) بعد موجة قصيرة
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
