apiVersion: v1
kind: ConfigMap
metadata:
  name: topchoice-config
  namespace: topchoice
data:
  # ---- إعدادات عامة ----
  # مكتبات Google تلتقط المشروع من خادم البيانات الوصفية داخل GKE، لكننا
  # نمرّره صراحةً ليبقى نفس الكود صالحًا في docker-compose حيث لا وجود لذلك الخادم.
  # القيمة تُستبدل في خط الـ CI لأن dev و prod مشروعان منفصلان.
  GCP_PROJECT_ID: "PROJECT_ID"
  GCP_REGION: "me-central1"
  LOG_LEVEL: "INFO"

  # ---- اكتشاف الخدمات ----
  # DNS داخل العنقود: <service>.<namespace>.svc.cluster.local
  SERVICE_URL_IDENTITY: "http://identity-service.topchoice.svc.cluster.local:8081"
  SERVICE_URL_CATALOG: "http://catalog-service.topchoice.svc.cluster.local:8082"
  SERVICE_URL_ORDER: "http://order-service.topchoice.svc.cluster.local:8083"
  SERVICE_URL_PAYMENT: "http://payment-service.topchoice.svc.cluster.local:8084"
  SERVICE_URL_INVENTORY: "http://inventory-service.topchoice.svc.cluster.local:8085"
  SERVICE_URL_CART: "http://cart-service.topchoice.svc.cluster.local:8086"
  SERVICE_URL_SEARCH: "http://search-service.topchoice.svc.cluster.local:8087"
  SERVICE_URL_RECOMMENDATION: "http://recommendation-service.topchoice.svc.cluster.local:8088"
  CATALOG_URL: "http://catalog-service.topchoice.svc.cluster.local:8082"

  # ---- Kafka (Managed Service for Apache Kafka) ----
  # القيمة الحقيقية تُحقن من مخرجات Terraform عبر overlay
  KAFKA_BOOTSTRAP_SERVERS: "REPLACE_WITH_KAFKA_BOOTSTRAP"

  # ---- OpenSearch ----
  # لا نظير مُدارًا له في GCP، فهو يعمل كـ StatefulSet داخل العنقود نفسه
  # (راجع 30-opensearch.yaml). النتيجة عنوان ثابت لا يحتاج حقنًا من Terraform.
  OPENSEARCH_URL: "http://opensearch.topchoice.svc.cluster.local:9200"
  OPENSEARCH_INDEX: "products-v1"

  # ---- سلوك التطبيق ----
  JWT_ACCESS_TTL_SECONDS: "900"
  JWT_REFRESH_TTL_SECONDS: "2592000"
  DB_POOL_MAX: "15"

  # مقياس مهم: عدد الـ pods × DB_POOL_MAX يجب أن يبقى تحت حد Cloud SQL،
  # ولهذا نمر عبر Cloud SQL Auth Proxy الذي يوحّد التجميع ويشفّر الوصلة.
