# ============================================================================
#  ServiceAccounts.
#
#  الخدمات التي تحتاج AWS APIs فقط تحمل annotation الخاص بـ IRSA.
#  البقية بلا صلاحيات AWS إطلاقًا — أقل امتياز ممكن.
# ============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-service
  namespace: topchoice
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_APP_ROLE_ARN"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-service
  namespace: topchoice
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_APP_ROLE_ARN"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendation-service
  namespace: topchoice
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_APP_ROLE_ARN"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: topchoice
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_APP_ROLE_ARN"
automountServiceAccountToken: true
---
# خدمات لا تكلّم AWS مباشرة: بلا دور IAM وبلا توكن مُركّب تلقائيًا
apiVersion: v1
kind: ServiceAccount
metadata:
  name: topchoice-default
  namespace: topchoice
automountServiceAccountToken: false
