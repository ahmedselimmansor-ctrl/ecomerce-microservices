# ============================================================================
#  ServiceAccounts.
#
#  الخدمات التي تحتاج Google Cloud APIs فقط تحمل تعليق Workload Identity.
#  البقية بلا صلاحيات سحابية إطلاقًا — أقل امتياز ممكن.
#
#  اسم حساب خدمة Google بلا لاحقة بيئة عمدًا: dev و prod مشروعان منفصلان،
#  فالتمييز يقع في PROJECT_ID لا في الاسم، ويبقى الملف واحدًا للبيئتين.
#
#  الربط لا يكتمل هنا: Terraform يمنح roles/iam.workloadIdentityUser للعضو
#  serviceAccount:PROJECT_ID.svc.id.goog[topchoice/<اسم الـ KSA>].
#  الأسماء أدناه يجب أن تطابق local.workload_identity_services في
#  infra/terraform/versions.tf حرفًا بحرف — أي انحراف يفشل وقت التشغيل
#  برسالة «unable to impersonate» لا وقت التطبيق.
#
#  المعرّفات مختصرة (tc-*) لأن سقف معرّف حساب خدمة Google ثلاثون حرفًا،
#  و«topchoice-recommendation-service» يتجاوزه.
# ============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: topchoice
  annotations:
    # Firestore للجلسات ومفاتيح تعطيل التكرار
    iam.gke.io/gcp-service-account: "tc-api-gateway@PROJECT_ID.iam.gserviceaccount.com"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-service
  namespace: topchoice
  annotations:
    # Cloud Storage للوسائط + Managed Kafka
    iam.gke.io/gcp-service-account: "tc-catalog@PROJECT_ID.iam.gserviceaccount.com"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: topchoice
  annotations:
    # Managed Kafka + Pub/Sub لأوامر الإشعارات
    iam.gke.io/gcp-service-account: "tc-order@PROJECT_ID.iam.gserviceaccount.com"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: topchoice
  annotations:
    # Pub/Sub نشرًا واشتراكًا
    iam.gke.io/gcp-service-account: "tc-notification@PROJECT_ID.iam.gserviceaccount.com"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendation-service
  namespace: topchoice
  annotations:
    # Vertex AI Search for commerce + Pub/Sub للتفاعلات
    iam.gke.io/gcp-service-account: "tc-recommendation@PROJECT_ID.iam.gserviceaccount.com"
automountServiceAccountToken: true
---
---
# حساب خاص بلا هوية سحابية: OpenSearch يعمل داخل العنقود لا كخدمة مُدارة،
# وبيانات اعتماده تصل عبر External Secrets كـ Secret عادي في مساحة الأسماء.
# نفرده عن الحساب الافتراضي رغم ذلك، لأن NetworkPolicy وقواعد RBAC تُكتب
# بالهوية — وهوية مشتركة تعني سياسة مشتركة.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-service
  namespace: topchoice
automountServiceAccountToken: false
---
# ----------------------------------------------------------------------------
# باقي الخدمات (identity، payment، inventory، cart، web) لا تكلّم Google Cloud
# APIs مباشرة: أسرارها تصل عبر External Secrets، وقواعد بياناتها عبر الشبكة
# الخاصة. بلا حساب سحابي وبلا توكن مُركّب تلقائيًا.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: topchoice-default
  namespace: topchoice
automountServiceAccountToken: false
