# واجهة Next.js — SSR لكل صفحة غير مخزّنة
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: topchoice
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: topchoice
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # لا نقلّل الطاقة أثناء النشر: pod جديد يصعد قبل أن ينزل القديم
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: topchoice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: topchoice-default
      # مهلة الإنهاء تسمح بإنهاء الطلبات الجارية قبل إغلاق العملية
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # الخدمات الحرجة على عُقد Standard فقط: سحب Spot أثناء معالجة طلب
      # يعني معاملة معلّقة، وهو ثمن لا يستحق التوفير.
      # GKE يضع هذا التصنيف على كل عقدة يوفّرها — بما فيها ما يهبط من
      # التوفير التلقائي — فلا حاجة لمجموعة عُقد مخصّصة لهذه الخدمات.
      nodeSelector:
        cloud.google.com/gke-provisioning: standard
      # توزيع النسخ على نطاقات التوفر: سقوط نطاق لا يُسقط الخدمة
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      containers:
        - name: web
          image: topchoice/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: topchoice-config, key: LOG_LEVEL } }
            - name: GCP_PROJECT_ID
              valueFrom: { configMapKeyRef: { name: topchoice-config, key: GCP_PROJECT_ID } }
            - name: GCP_REGION
              valueFrom: { configMapKeyRef: { name: topchoice-config, key: GCP_REGION } }
            - name: INTERNAL_API_URL
              value: "http://api-gateway.topchoice.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              # لا حد للـ CPU عمدًا في الخدمات الحساسة للزمن: الـ throttling
              # يضاعف زمن الاستجابة أسوأ من الازدحام نفسه
              cpu: 1000m
              memory: 768Mi
          # startupProbe يمنح الإقلاع البطيء (JVM) وقتًا كافيًا
          # دون إرخاء liveness بعد الإقلاع
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # مهلة قصيرة قبل الإغلاق: تسمح لـ kube-proxy بإزالة الـ pod
                # من جدول التوجيه قبل أن يتوقف عن القبول
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: topchoice
  labels:
    app.kubernetes.io/name: web
  annotations:
    # يوجّه الحركة لأقرب نسخة داخل نفس نطاق التوفر:
    # يقلّل زمن الاستجابة وتكلفة نقل البيانات بين النطاقات
    service.kubernetes.io/topology-mode: Auto
    # الربط بإعدادات الخلفية في موازن Google — هنا يُفعَّل Cloud CDN
    cloud.google.com/backend-config: '{"default": "web"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: topchoice
spec:
  # يضمن بقاء أغلبية النسخ أثناء صيانة العُقد أو سحب Spot
  minAvailable: 60%
  selector:
    matchLabels:
      app.kubernetes.io/name: web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: topchoice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # الصعود فوري: تأخير التوسّع أثناء ذروة مفاجئة يعني طلبات مفقودة
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # الهبوط بطيء: يتجنّب التذبذب (thrashing) بعد موجة قصيرة
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
