# ============================================================================
#  KEDA — التوسّع بعمق الطابور لا بالـ CPU.
#
#  لماذا؟ مستهلك Kafka يقضي وقته منتظرًا لا حاسبًا، فاستهلاكه للـ CPU منخفض
#  حتى عندما يتأخر آلاف الرسائل. HPA على CPU لن يوسّعه إطلاقًا. المقياس
#  الصحيح هو consumer lag: كم رسالة تنتظر المعالجة.
# ============================================================================

# الاستثناء الوحيد في هذا المستودع عن قاعدة "بلا مفاتيح ثابتة":
# Managed Service for Apache Kafka تُصادَق بتوكن OAuth من Google، وسكالر
# Kafka في KEDA لا يملك مسار Workload Identity — فهو يعمل خارج pods
# التطبيق ولا يرث هوية أيٍّ منها. لذلك نزامن بيانات اعتماد OAuth من
# Secret Manager بدل الاعتماد على الهوية المرتبطة بالـ KSA.
# البديل — سكالر خارجي يجلب التوكن من خادم البيانات الوصفية بنفسه —
# مكوّن كامل نكتبه ونصونه لأجل قراءة رقم تأخّر واحد.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: managed-kafka-oauth
  namespace: topchoice
spec:
  secretTargetRef:
    - parameter: oauthClientID
      name: topchoice-kafka-oauth
      key: clientID
    - parameter: oauthClientSecret
      name: topchoice-kafka-oauth
      key: clientSecret
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service
  namespace: topchoice
spec:
  scaleTargetRef:
    name: notification-service
  minReplicaCount: 2
  maxReplicaCount: 30
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: REPLACE_WITH_KAFKA_BOOTSTRAP
        consumerGroup: notification-service
        topic: notification.commands.v1
        # نسخة إضافية لكل 500 رسالة متأخرة
        lagThreshold: "500"
        offsetResetPolicy: latest
        sasl: oauthbearer
        tls: enable
        oauthTokenEndpointUri: https://oauth2.googleapis.com/token
        scopes: https://www.googleapis.com/auth/cloud-platform
      authenticationRef:
        name: managed-kafka-oauth
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: search-service-indexer
  namespace: topchoice
spec:
  scaleTargetRef:
    name: search-service
  minReplicaCount: 2
  maxReplicaCount: 12
  pollingInterval: 20
  cooldownPeriod: 300
  triggers:
    # مزيج مقصود: الفهرسة تتبع تأخّر Kafka، والبحث يتبع الـ CPU
    - type: kafka
      metadata:
        bootstrapServers: REPLACE_WITH_KAFKA_BOOTSTRAP
        consumerGroup: search-service
        topic: catalog.product.v1
        lagThreshold: "1000"
        sasl: oauthbearer
        tls: enable
        oauthTokenEndpointUri: https://oauth2.googleapis.com/token
        scopes: https://www.googleapis.com/auth/cloud-platform
      authenticationRef:
        name: managed-kafka-oauth
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
---
# مثال على التوسّع المجدول للأحداث المعروفة مسبقًا (White Friday)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api-gateway-scheduled
  namespace: topchoice
  annotations:
    description: >-
      رفع الحد الأدنى قبل ذروة معروفة. التوسّع التفاعلي وحده متأخر جدًا
      عند موجة تبدأ في ثوانٍ.
spec:
  scaleTargetRef:
    name: api-gateway
  minReplicaCount: 3
  maxReplicaCount: 60
  triggers:
    - type: cron
      metadata:
        timezone: Asia/Dubai
        # ساعة الذروة اليومية
        start: "0 18 * * *"
        end: "0 23 * * *"
        desiredReplicas: "8"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "65"
