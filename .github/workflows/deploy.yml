name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: البيئة المستهدفة
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      tag:
        description: وسم الصورة
        required: true
        default: latest

concurrency:
  # نشر واحد لكل بيئة في الوقت نفسه — نشران متزامنان يعنيان حالة غير محددة
  group: deploy-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

env:
  GCP_REGION: me-central1
  GAR_HOST: me-central1-docker.pkg.dev
  REGISTRY: me-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/topchoice
  ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  IMAGE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write   # OIDC: لا مفاتيح خدمة مخزّنة في GitHub
  contents: read

jobs:
  build-and-push:
    name: build and push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { service: api-gateway,            context: services/api-gateway }
          - { service: identity-service,       context: services/identity-service }
          - { service: catalog-service,        context: services/catalog-service }
          - { service: order-service,          context: services/order-service }
          - { service: payment-service,        context: services/payment-service }
          - { service: inventory-service,      context: services/inventory-service }
          - { service: cart-service,           context: services/cart-service }
          - { service: search-service,         context: services/search-service }
          - { service: recommendation-service, context: services/recommendation-service }
          - { service: notification-service,   context: services/notification-service }
          - { service: web,                    context: frontend/web }

    steps:
      - uses: actions/checkout@v4

      - name: authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Workload Identity Federation: GitHub يوقّع OIDC token لكل تشغيل،
          # وGoogle يستبدله بـ access token عمره دقائق. البديل — مفتاح JSON
          # لحساب خدمة داخل secrets — سرّ دائم لا ينتهي، ينسخه من يقرأه مرة
          # واحدة ويبقى صالحًا حتى يلاحظ أحدهم غيابه.
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: login to Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_HOST }} --quiet

      - uses: docker/setup-buildx-action@v3

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # عُقد العنقود في me-central1 من عائلات x86؛ صورة arm64 لن تُجدوَل
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}

      - name: scan pushed image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          # ثغرة حرجة في صورة متجهة للإنتاج توقف النشر
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    name: deploy to GKE
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}

    steps:
      - uses: actions/checkout@v4

      - name: authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # نفس السبب أعلاه: هوية اتحادية قصيرة العمر بدل مفتاح JSON دائم
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          # المكوّن الذي يزرع gke-gcloud-auth-plugin؛ بدونه يرفض kubectl
          # الاتصال بالعنقود منذ Kubernetes 1.26
          install_components: gke-gcloud-auth-plugin

      - name: connect kubectl
        run: |
          gcloud container clusters get-credentials \
            topchoice-${{ env.ENVIRONMENT }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: set image tags
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

          cd infra/k8s/overlays/${{ env.ENVIRONMENT }}

          for svc in api-gateway identity-service catalog-service order-service \
                     payment-service inventory-service cart-service search-service \
                     recommendation-service notification-service web; do
            kustomize edit set image "topchoice/${svc}=${{ env.REGISTRY }}/${svc}:${{ env.IMAGE_TAG }}"
          done

      - name: show diff
        run: kubectl diff -k infra/k8s/overlays/${{ env.ENVIRONMENT }} || true

      - name: apply
        run: kubectl apply -k infra/k8s/overlays/${{ env.ENVIRONMENT }}

      - name: wait for rollout
        run: |
          # فشل أي خدمة في الإقلاع خلال 5 دقائق يوقف المهمة
          # ويترك النسخة القديمة تعمل (maxUnavailable: 0)
          for svc in api-gateway identity-service catalog-service order-service \
                     payment-service inventory-service cart-service search-service \
                     recommendation-service notification-service web; do
            echo "waiting for ${svc}"
            kubectl rollout status "deployment/${svc}" -n topchoice --timeout=5m
          done

      - name: post-deploy smoke test
        run: |
          GATEWAY_URL="${{ secrets.PUBLIC_API_URL }}" ./scripts/smoke-test.sh

      - name: rollback on failure
        if: failure()
        run: |
          echo "::error::deployment failed — rolling back"
          for svc in api-gateway identity-service catalog-service order-service \
                     payment-service inventory-service cart-service search-service \
                     recommendation-service notification-service web; do
            kubectl rollout undo "deployment/${svc}" -n topchoice || true
          done

      - name: invalidate CDN
        if: success()
        run: |
          # إبطال الأصول فقط: إبطال /* يُفرّغ الحافة بالكامل فتنهال إعادة
          # التعبئة على الـ backend دفعةً واحدة بعد كل نشرة.
          # Cloud CDN يقبل مسارًا واحدًا لكل نداء، فنكرّر النداء لا النمط.
          for path in "/_next/static/*" "/index.html" "/"; do
            gcloud compute url-maps invalidate-cdn-cache \
              ${{ secrets.GCP_URL_MAP }} \
              --path "$path" \
              --global \
              --project ${{ secrets.GCP_PROJECT_ID }} \
              --async
          done
