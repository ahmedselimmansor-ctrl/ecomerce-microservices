name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: البيئة المستهدفة
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      tag:
        description: وسم الصورة
        required: true
        default: latest

concurrency:
  # نشر واحد لكل بيئة في الوقت نفسه — نشران متزامنان يعنيان حالة غير محددة
  group: deploy-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

env:
  AWS_REGION: me-south-1
  ENVIRONMENT: ${{ inputs.environment || 'prod' }}
  IMAGE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  id-token: write   # OIDC: لا مفاتيح AWS مخزّنة في GitHub
  contents: read

jobs:
  build-and-push:
    name: build and push images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { service: api-gateway,            context: services/api-gateway }
          - { service: identity-service,       context: services/identity-service }
          - { service: catalog-service,        context: services/catalog-service }
          - { service: order-service,          context: services/order-service }
          - { service: payment-service,        context: services/payment-service }
          - { service: inventory-service,      context: services/inventory-service }
          - { service: cart-service,           context: services/cart-service }
          - { service: search-service,         context: services/search-service }
          - { service: recommendation-service, context: services/recommendation-service }
          - { service: notification-service,   context: services/notification-service }
          - { service: web,                    context: frontend/web }

    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # arm64 يطابق عُقد Graviton في العنقود
          platforms: linux/arm64
          tags: |
            ${{ steps.ecr.outputs.registry }}/topchoice/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/topchoice/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}

      - name: scan pushed image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/topchoice/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          # ثغرة حرجة في صورة متجهة للإنتاج توقف النشر
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    name: deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}

    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: connect kubectl
        run: |
          aws eks update-kubeconfig \
            --name topchoice-${{ env.ENVIRONMENT }} \
            --region ${{ env.AWS_REGION }}

      - name: set image tags
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          cd infra/k8s/overlays/${{ env.ENVIRONMENT }}

          for svc in api-gateway identity-service catalog-service order-service \
                     payment-service inventory-service cart-service search-service \
                     recommendation-service notification-service web; do
            kustomize edit set image "topchoice/${svc}=${REGISTRY}/topchoice/${svc}:${{ env.IMAGE_TAG }}"
          done

      - name: show diff
        run: kubectl diff -k infra/k8s/overlays/${{ env.ENVIRONMENT }} || true

      - name: apply
        run: kubectl apply -k infra/k8s/overlays/${{ env.ENVIRONMENT }}

      - name: wait for rollout
        run: |
          # فشل أي خدمة في الإقلاع خلال 5 دقائق يوقف المهمة
          # ويترك النسخة القديمة تعمل (maxUnavailable: 0)
          for svc in api-gateway identity-service catalog-service order-service \
                     payment-service inventory-service cart-service search-service \
                     recommendation-service notification-service web; do
            echo "waiting for ${svc}"
            kubectl rollout status "deployment/${svc}" -n topchoice --timeout=5m
          done

      - name: post-deploy smoke test
        run: |
          GATEWAY_URL="${{ secrets.PUBLIC_API_URL }}" ./scripts/smoke-test.sh

      - name: rollback on failure
        if: failure()
        run: |
          echo "::error::deployment failed — rolling back"
          for svc in api-gateway identity-service catalog-service order-service \
                     payment-service inventory-service cart-service search-service \
                     recommendation-service notification-service web; do
            kubectl rollout undo "deployment/${svc}" -n topchoice || true
          done

      - name: invalidate CDN
        if: success()
        run: |
          # إبطال الأصول فقط: إبطال /* يكلّف كثيرًا ويُفرّغ الحافة بالكامل
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/_next/static/*" "/index.html" "/"
