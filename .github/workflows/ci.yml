name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  # إلغاء التشغيلات القديمة لنفس الفرع: لا فائدة من بناء commit متجاوَز
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ secrets.ECR_REGISTRY }}
  AWS_REGION: me-south-1

jobs:
  # ------------------------------------------------------------------ detect
  changes:
    name: detect changed services
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      node: ${{ steps.filter.outputs.node }}
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      # نبني ما تغيّر فقط: خط أنابيب يبني كل شيء دائمًا يصبح بطيئًا
      # لدرجة أن الفريق يتوقف عن انتظاره
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            java:
              - 'services/identity-service/**'
              - 'services/catalog-service/**'
              - 'services/order-service/**'
              - 'services/payment-service/**'
              - 'services/inventory-service/**'
            node:
              - 'services/api-gateway/**'
              - 'services/cart-service/**'
              - 'services/notification-service/**'
            python:
              - 'services/search-service/**'
              - 'services/recommendation-service/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'
              - 'deploy/**'

  # -------------------------------------------------------------------- java
  java:
    name: java services
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - catalog-service
          - order-service
          - payment-service
          - inventory-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: build and test
        working-directory: services/${{ matrix.service }}
        run: mvn -B verify

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-${{ matrix.service }}-tests
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  # -------------------------------------------------------------------- node
  node:
    name: node services
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, cart-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install
        working-directory: services/${{ matrix.service }}
        run: npm install --no-audit --no-fund

      - name: typecheck
        working-directory: services/${{ matrix.service }}
        run: npm run typecheck

      - name: build
        working-directory: services/${{ matrix.service }}
        run: npm run build

  # ------------------------------------------------------------------ python
  python:
    name: python services
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [search-service, recommendation-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pip install ruff mypy

      - name: lint
        working-directory: services/${{ matrix.service }}
        run: ruff check app/

      - name: import check
        working-directory: services/${{ matrix.service }}
        run: python -c "import app.main"

  # ---------------------------------------------------------------- frontend
  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install
        working-directory: frontend/web
        run: npm install --no-audit --no-fund

      - name: typecheck
        working-directory: frontend/web
        run: npm run typecheck

      - name: build
        working-directory: frontend/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

  # ------------------------------------------------------------------- infra
  infra:
    name: infrastructure
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - name: kustomize build
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          ./kustomize build infra/k8s/overlays/dev > /dev/null
          ./kustomize build infra/k8s/overlays/prod > /dev/null

  # ---------------------------------------------------------------- security
  security:
    name: security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # لا نُفشل الـ PR على ثغرة في تبعية طرف ثالث؛ نرفعها للمراجعة
          exit-code: '0'

      - name: upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------- integration tests
  integration:
    name: integration (docker compose)
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v4

      - name: create env file
        run: cp .env.example .env

      - name: start the platform
        run: |
          docker compose -f deploy/docker-compose.yml --env-file .env up -d --build \
            postgres mongo redis kafka opensearch mailpit
          timeout 300 bash -c '
            until [ -z "$(docker compose -f deploy/docker-compose.yml --env-file .env ps --format "{{.Health}}" | grep starting)" ]; do
              sleep 5
            done'
          docker compose -f deploy/docker-compose.yml --env-file .env up -d --build \
            identity-service catalog-service inventory-service order-service \
            payment-service cart-service search-service recommendation-service \
            notification-service api-gateway
          sleep 90

      - name: seed data
        run: ./scripts/seed.sh

      - name: smoke test
        run: ./scripts/smoke-test.sh

      - name: admin dashboard test
        run: ./scripts/admin-test.sh

      - name: dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs --tail=200

      - name: tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file .env down -v
